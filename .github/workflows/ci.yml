name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # Exercises the real HTTP surface, including provenance rules and the
      # assistant's graceful degradation when no API key is present.
      - name: Smoke test
        run: |
          npm start &
          npx wait-on http://localhost:3000/api/health --timeout 60000
          node scripts/smoke.mjs
